# The App Blueprint repository's own metadata (never applied to a Work, never copied into a user's
# repositories — it is read only by the catalog/resolver).
#
# This repository is the App Blueprint "Cal (community build)" for the upstream project `calcom/cal.diy`.
# It is METADATA-ONLY: it holds our metadata and no application source, so creating an App Work forks the
# upstream (the Work's repository) and records this repository as provenance. `code-bearing` would require
# this repository to be a fork of the upstream (T4: `isFork` with the recorded fork-network root); it is not,
# so it declares the shape it actually is.
#
# The App spec is `.works/works.yml`, the specification's default path and the only file the platform's
# Blueprint resolver reads, so no `specPath` is set.
#
# Field meanings and the shape rules are the resolution specification's §2.1 (T1-T8).

schemaVersion: 1
kind: app

shape: metadata-only

source:
    repo: calcom/cal.diy # owner/name of the upstream project; never this repository (T5)
    defaultBranch: main
    aliases: [calcom/cal.com] # a former name the same project is still addressed by
    refs: { branches: [main] } # tag v6.2.0 and older are a different licence and a different code base
